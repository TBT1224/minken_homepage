    .steps { padding-left:1.7em; margin:0; }

    .steps li:last-child { padding-bottom:0; }
    .fees { width:100%; border-collapse:collapse; margin:12px 0 18px; }
    .fees th,.fees td { border:1px solid var(--border); padding:12px 16px; text-align:left; }
    .fees th { background:#f7f0f2; color:var(--deep); }
    .back { display:inline-block; color:var(--primary); font-weight:700; margin-top:10px; text-decoration:none; }
